name: ownagent-private

services:
  app:
    image: ownagent:${OWNAGENT_IMAGE_TAG:-private-local}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATABASE_PATH: /data/builder.db
      OWNAGENT_CONFIG_DIR: /data/.ownagent
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in deploy/private/.env}"
      OWNAGENT_BOOTSTRAP_TOKEN: "${OWNAGENT_BOOTSTRAP_TOKEN:?Set OWNAGENT_BOOTSTRAP_TOKEN}"
      OWNAGENT_INGEST_KEY: "${OWNAGENT_INGEST_KEY:?Set OWNAGENT_INGEST_KEY}"
      CORS_ORIGINS: "${CORS_ORIGINS:?Set CORS_ORIGINS in deploy/private/.env}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.deepseek.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-deepseek-chat}"
      PROBE_URL: "${PROBE_URL:-http://localhost:8080/index.html}"
      FEISHU_WEBHOOK_URL: "${FEISHU_WEBHOOK_URL:-}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
      APPROVAL_EMAIL_TO: "${APPROVAL_EMAIL_TO:-}"
      EMAIL_NOTIFICATION_ENDPOINT: "${EMAIL_NOTIFICATION_ENDPOINT:-}"
    expose:
      - "8787"
    volumes:
      - ownagent-data:/data
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8787/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - private

  # The existing production image already contains /app/dist. Copy it into a
  # shared volume so Nginx can serve it without changing the root Dockerfile.
  frontend-assets:
    image: ownagent:${OWNAGENT_IMAGE_TAG:-private-local}
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - "rm -rf /srv/www/* && cp -a /app/dist/. /srv/www/"
    volumes:
      - frontend-assets:/srv/www

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PRIVATE_HTTP_PORT:-8080}:80"
    volumes:
      - frontend-assets:/usr/share/nginx/html:ro
      - ./nginx.private.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      frontend-assets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - private

volumes:
  ownagent-data:
  frontend-assets:

networks:
  private:
    internal: false
