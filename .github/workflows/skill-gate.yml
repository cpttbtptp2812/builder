name: Skill Gate

on:
  pull_request:
    paths:
      - "src/skills/**"
      - ".ownagent/**"
      - "scripts/ownagent-check.ts"
  push:
    branches: [main]
    paths:
      - "src/skills/**"
      - ".ownagent/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Prove (compile + mock trace)
        run: npm run prove

      - name: OwnAgent check (all skills)
        id: gate
        run: |
          npm run check:skills > gate-report.json
          cat gate-report.json

      - name: Comment PR with gate summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('gate-report.json', 'utf8'));
            const lines = report.results.map(r =>
              `| ${r.skillId} | **${r.gate}** | ${r.tracePass}/${r.traceTotal} | ${r.reasons[0] ?? ''} |`
            );
            const body = `## OwnAgent Skill Gate\n\n| Skill | Verdict | Trace | Reason |\n|-------|---------|-------|--------|\n${lines.join('\n')}\n\nΔP / 全量 SCM 请在本地发版检查中查看。`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

