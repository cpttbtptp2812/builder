name: Skill Gate

on:
  pull_request:
    paths:
      - "src/skills/**"
      - ".ownagent/**"
      - "scripts/ownagent-check.ts"
  push:
    branches: [main]
    paths:
      - "src/skills/**"
      - ".ownagent/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Prove (compile + mock trace)
        run: npm run prove

      - name: OwnAgent check (all skills)
        id: gate
        run: |
          npm run check:skills > gate-report.json
          cat gate-report.json

      - name: Comment PR with gate summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('gate-report.json', 'utf8'));
            const lines = report.results.map(r => {
              const delta = r.deltaSuccess > 0 ? `+${r.deltaSuccess}` : String(r.deltaSuccess ?? 0);
              const pivotal = r.pivotalStepId ? `\`${r.pivotalStepId}\` (${r.pivotalTool ?? 'unknown'})` : '—';
              const failed = r.failedCases?.length
                ? r.failedCases.map(c => `\`${c.id}\``).join(', ')
                : '—';
              const coverage = `${r.coverage?.exactPct ?? 0}%${r.coverage?.incomplete ? '（未看全）' : ''}`;
              const impact = [...(r.impact?.direct ?? []), ...(r.impact?.transitive ?? [])].filter(x => x !== r.skillId);
              return `| ${r.skillId} | **${r.gate}** | ${delta} | ${pivotal} | ${coverage} | ${failed} | ${impact.length ? impact.join(', ') : '—'} |`;
            });
            const body = `## OwnAgent Skill Gate\n\n协议：\`${report.schema}\` · 环境：\`${report.environment}\`\n\n| Skill | Verdict | ΔP(pass) | Pivotal Step | Exact | Failed cases | Impact |\n|-------|---------|----------|--------------|-------|--------------|--------|\n${lines.join('\n')}\n\n<details><summary>门禁原因</summary>\n\n${report.results.map(r => `### ${r.skillId}\n${(r.reasons ?? []).map(x => `- ${x}`).join('\n')}`).join('\n\n')}\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

