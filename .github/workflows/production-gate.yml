name: Production Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:production
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Validate private deployment manifest
        run: docker compose --env-file deploy/private/.env.example -f deploy/private/docker-compose.private.yml config --quiet

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
