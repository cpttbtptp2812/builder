<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Mirror</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <div class="logo">M</div>
    <div><strong>Mirror</strong><span>网络请求镜像</span></div>
    <button type="button" class="btn-icon" id="clear" title="清空">↻</button>
  </header>

  <p class="hint">在当前页打开后，所有 Fetch / XHR 会记录在此。点击条目复制 curl。</p>

  <ul class="log" id="log"></ul>

  <details class="mock">
    <summary>Mock 规则（URL 包含即拦截）</summary>
    <div class="mock-form">
      <input id="mock-pattern" placeholder="URL 片段，如 /api/user" />
      <textarea id="mock-body" rows="3" placeholder='{"ok":true}'></textarea>
      <button type="button" class="btn" id="mock-save">保存 Mock</button>
    </div>
    <ul id="mock-list"></ul>
  </details>

  <script src="popup.js"></script>
</body>
</html>
