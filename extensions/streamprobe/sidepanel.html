<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>StreamProbe</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="sp-head">
      <div class="sp-brand">
        <span class="sp-logo">SP</span>
        <div>
          <strong>StreamProbe</strong>
          <span id="sp-tab-url">—</span>
        </div>
      </div>
      <div class="sp-actions">
        <button type="button" id="sp-export" title="导出会话">↓</button>
        <button type="button" id="sp-clear" title="清空">↻</button>
      </div>
    </header>

    <section class="sp-metrics" id="sp-metrics"></section>

    <section class="sp-empty-guide" id="sp-empty-guide" hidden>
      <p><strong>当前页没有捕获到流式数据</strong></p>
      <p id="sp-empty-reason">StreamProbe 只监测 <code>EventSource</code> 和 <code>fetch</code> 流式响应。普通搜索页、静态网页不会产生数据。</p>
      <ol>
        <li>先点下方「打开测试页」验证扩展是否正常</li>
        <li>再到你的 AI 对话 / SSE 页面，<strong>刷新页面</strong>后重试</li>
        <li>在页面上触发一次对话或流式请求</li>
      </ol>
      <button type="button" id="sp-open-demo" class="sp-demo-btn">打开测试页并模拟流</button>
    </section>

    <div class="sp-layout">
      <aside class="sp-conn">
        <h2>连接</h2>
        <ul id="sp-connections"></ul>
      </aside>
      <section class="sp-timeline">
        <h2>帧时间线</h2>
        <ul id="sp-frames"></ul>
      </section>
      <section class="sp-detail">
        <h2>帧详情</h2>
        <div class="sp-split">
          <div>
            <h3>Raw</h3>
            <pre id="sp-raw">选择左侧一帧</pre>
          </div>
          <div>
            <h3>Parsed</h3>
            <pre id="sp-parsed">—</pre>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
