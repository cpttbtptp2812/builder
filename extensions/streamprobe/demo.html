<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>StreamProbe 测试页</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 42rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      .banner {
        background: #ecfeff;
        border: 1px solid #a5f3fc;
        border-radius: 10px;
        padding: 0.85rem 1rem;
        margin-bottom: 1rem;
        font-size: 0.9rem;
      }
      button {
        margin: 0 0.5rem 0.5rem 0;
        padding: 0.55rem 0.85rem;
        cursor: pointer;
      }
      button.primary {
        background: #0891b2;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 700;
      }
      pre {
        background: #f1f5f9;
        padding: 0.75rem;
        border-radius: 0.5rem;
        font-size: 0.85rem;
        max-height: 14rem;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>StreamProbe 测试页</h1>
    <div class="banner">
      <strong>怎么用：</strong>先打开 Side Panel → 再点下面<strong>绿色按钮</strong> → 看 Panel
      里出现连接和帧。验证通过后再去你的 AI 项目页。
    </div>
    <button type="button" id="mock" class="primary">▶ 模拟 AI 流式回复（推荐）</button>
    <button type="button" id="es">EventSource 实测</button>
    <button type="button" id="fetch">fetch stream 实测</button>
    <pre id="log"></pre>
    <script>
      const log = document.getElementById("log");
      function append(s) {
        log.textContent += s + "\n";
      }

      function emit(detail) {
        chrome.runtime.sendMessage({ type: "sp-event", payload: detail }).catch((e) => {
          append("发送失败: " + e.message);
        });
      }

      document.getElementById("mock").addEventListener("click", async () => {
        log.textContent = "";
        append("模拟 AI NDJSON 流…请看 Side Panel");
        const cid = "demo-" + Date.now();
        const url = location.href + "#mock";
        emit({ phase: "open", kind: "fetch-stream", connectionId: cid, url, t: Date.now() });
        const lines = [
          '{"type":"start","turnId":"demo-1"}',
          '{"type":"text-delta","text":"你好，"}',
          '{"type":"text-delta","text":"StreamProbe 工作正常！"}',
          '{"type":"tool-call","toolName":"search","toolCallId":"tc-1"}',
          '{"type":"tool-result","toolCallId":"tc-1","result":"ok"}',
          '{"type":"finish"}',
        ];
        for (const line of lines) {
          append("→ " + line);
          emit({
            phase: "message",
            kind: "fetch-stream",
            connectionId: cid,
            url,
            raw: line,
            t: Date.now(),
          });
          await new Promise((r) => setTimeout(r, 400));
        }
        emit({ phase: "close", kind: "fetch-stream", connectionId: cid, url, t: Date.now() });
        append("完成 — Side Panel 应显示 8+ 帧");
      });

      document.getElementById("es").addEventListener("click", () => {
        log.textContent = "";
        append("连接 Wikimedia EventSource…");
        const es = new EventSource("https://stream.wikimedia.org/v2/stream/recentchange");
        es.onmessage = (ev) => append("message: " + ev.data.slice(0, 60) + "…");
        es.onerror = () => append("error / closed");
        setTimeout(() => es.close(), 8000);
      });

      document.getElementById("fetch").addEventListener("click", async () => {
        log.textContent = "";
        append("fetch httpbin stream…");
        try {
          const res = await fetch("https://httpbin.org/stream/5");
          await res.text();
          append("done — 请看 Side Panel");
        } catch (e) {
          append("fail: " + e.message);
        }
      });
    </script>
  </body>
</html>
