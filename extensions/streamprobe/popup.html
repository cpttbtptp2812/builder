<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>StreamProbe</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="logo">SP</span>
      <div>
        <strong>StreamProbe</strong>
        <span id="version">v—</span>
      </div>
    </header>

    <p class="what">调试 AI / SSE 流式接口 — 把 Network 里看不清的每一帧展开。</p>

    <div class="status" id="status">
      <span class="status-dot idle" id="status-dot"></span>
      <span id="status-text">检测中…</span>
    </div>

    <button type="button" id="self-test" class="primary">▶ 一键自检（任意页面可点）</button>
    <button type="button" id="open-panel">打开 Side Panel</button>
    <button type="button" id="open-demo">打开测试页（真实 hook）</button>
    <button type="button" id="clear" class="ghost">清空当前页数据</button>

    <p class="hint" id="hint"></p>
    <script src="popup.js"></script>
  </body>
</html>
