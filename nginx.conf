server {
    listen 80;
    server_name ownagent.com.cn www.ownagent.com.cn ownagent.site www.ownagent.site 43.142.74.224 localhost;

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 反向代理至 Spring Boot 3 Java 后端
    location /api/ {
        proxy_pass http://agent-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 全双工流式传输优化 (禁止缓冲、保持长连接)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}

server {
    listen 443 ssl;
    server_name ownagent.com.cn www.ownagent.com.cn;

    ssl_certificate /etc/letsencrypt/live/ownagent.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ownagent.com.cn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 反向代理至 Spring Boot 3 Java 后端
    location /api/ {
        proxy_pass http://agent-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE 全双工流式传输优化 (禁止缓冲、保持长连接)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
