version: '3.8'

services:
  agent-mysql:
    image: mysql:8.0
    restart: always
    container_name: agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword2026!
      MYSQL_DATABASE: agent_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    networks:
      - agent-net

  agent-backend:
    image: eclipse-temurin:21-jre
    restart: always
    container_name: agent-backend
    volumes:
      - ./app.jar:/app/app.jar
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=agent-mysql
      - DB_PORT=3306
      - DB_NAME=agent_db
      - DB_USER=root
      - DB_PASSWORD=RootPassword2026!
    ports:
      - "8080:8080"
    depends_on:
      - agent-mysql
    command: ["java", "-Djava.security.egd=file:/dev/./urandom", "-jar", "/app/app.jar"]
    networks:
      - agent-net

  agent-frontend:
    image: nginx:alpine
    restart: always
    container_name: agent-frontend
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - agent-backend
    networks:
      - agent-net

volumes:
  mysql-data:

networks:
  agent-net:
    driver: bridge
