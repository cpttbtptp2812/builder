version: "3.9"

services:
  # ── OwnAgent 主服务（前端 + 后端 + SQLite RAG）──────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ownagent
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    environment:
      PORT: "8787"
      DATABASE_PATH: /data/builder.db
      # LLM (必填其一)
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.deepseek.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-deepseek-chat}"
      # 管理员密码（默认 admin123，正式部署请修改）
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      # CORS 允许来源（多个用逗号分隔）
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}"
    volumes:
      - ownagent_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Nginx 静态文件服务 + 反向代理（可选，生产环境推荐）───────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ownagent-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-3000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    profiles:
      - nginx

volumes:
  ownagent_data:
    name: ownagent_data
